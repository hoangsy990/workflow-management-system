[package]
name = "workflow-management-system"
version = "0.1.0"
description = "WorkFlow Management System native shell"
authors = ["WorkFlow"]
license = "UNLICENSED"
edition = "2021"

[lib]
name = "workflow_management_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
