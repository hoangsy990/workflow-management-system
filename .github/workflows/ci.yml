name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workflow/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  smoke-web:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workflow/web exec playwright install --with-deps chromium
      - run: docker compose up -d --build
      - name: Seed Docker database
        run: docker compose exec -T api node apps/api/dist/prisma/seed.js
      - name: Wait for web
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run Playwright smoke tests
        run: pnpm smoke:web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:4000/api/v1
      - name: Collect Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-web-artifacts
          path: |
            docker-compose.log
            apps/web/test-results
            apps/web/playwright-report
      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v
